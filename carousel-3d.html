<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Карусель - Куб и Труба</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #imageInput {
            display: none;
        }

        .image-count {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="range"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .carousel-container {
            position: relative;
            height: 500px;
            perspective: 1200px;
            overflow: hidden;
            border-radius: 15px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cube Style */
        .carousel-cube {
            position: relative;
            width: 300px;
            height: 400px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-cube .slide {
            position: absolute;
            width: 300px;
            height: 400px;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
            backface-visibility: visible;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .carousel-cube .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Tube/Pipe Style */
        .carousel-tube {
            position: relative;
            width: 100%;
            height: 400px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-tube .slide {
            position: absolute;
            width: 280px;
            height: 380px;
            left: 50%;
            top: 50%;
            margin-left: -140px;
            margin-top: -190px;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .carousel-tube .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            color: #667eea;
            transition: all 0.3s;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .nav-btn.prev {
            left: 20px;
        }

        .nav-btn.next {
            right: 20px;
        }

        .indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: #667eea;
            transform: scale(1.2);
        }

        .thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            overflow-x: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            object-fit: cover;
            flex-shrink: 0;
        }

        .thumbnail:hover {
            transform: scale(1.05);
        }

        .thumbnail.active {
            border-color: #667eea;
            transform: scale(1.1);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-value {
            min-width: 60px;
            font-weight: 600;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-size: 18px;
            padding: 50px;
        }

        @media (max-width: 768px) {
            .carousel-cube,
            .carousel-cube .slide {
                width: 250px;
                height: 350px;
            }
            
            .carousel-tube .slide {
                width: 230px;
                height: 330px;
                margin-left: -115px;
                margin-top: -165px;
            }
            
            .carousel-container {
                height: 450px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 3D Карусель Изображений</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Загрузить изображения (2-8)</label>
                <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                    📁 Выбрать файлы
                </button>
                <input type="file" id="imageInput" multiple accept="image/*" onchange="handleImageUpload(event)">
                <div class="image-count" id="imageCount">Загружено: 0 изображений</div>
            </div>

            <div class="control-group">
                <label>Стиль карусели</label>
                <select id="carouselStyle" onchange="updateCarousel()">
                    <option value="cube">3D Куб</option>
                    <option value="tube">Труба/Цилиндр</option>
                </select>
            </div>

            <div class="control-group">
                <label>Автоматическая прокрутка</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="autoScroll" onchange="toggleAutoScroll()">
                    <span>Включить автопрокрутку</span>
                </div>
            </div>

            <div class="control-group">
                <label>Скорость прокрутки</label>
                <div class="speed-control">
                    <input type="range" id="scrollSpeed" min="1000" max="8000" value="3000" step="500" onchange="updateSpeed()">
                    <span class="speed-value" id="speedValue">3с</span>
                </div>
            </div>

            <div class="control-group">
                <label>Направление</label>
                <select id="scrollDirection" onchange="updateCarousel()">
                    <option value="normal">Обычное</option>
                    <option value="reverse">Обратное</option>
                </select>
            </div>
        </div>

        <div class="carousel-container" id="carouselContainer">
            <div class="empty-state" id="emptyState">
                Загрузите изображения для просмотра карусели
            </div>
            <div class="carousel-wrapper" id="carouselWrapper" style="display: none;">
                <button class="nav-btn prev" onclick="navigate(-1)">❮</button>
                <div id="carousel"></div>
                <button class="nav-btn next" onclick="navigate(1)">❯</button>
                <div class="indicators" id="indicators"></div>
            </div>
        </div>

        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let autoScrollInterval = null;
        let currentStyle = 'cube';
        let isPaused = false;

        function handleImageUpload(event) {
            const files = Array.from(event.target.files).slice(0, 8);
            
            if (files.length < 2) {
                alert('Пожалуйста, загрузите минимум 2 изображения');
                return;
            }

            images = [];
            const promises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        resolve(e.target.result);
                    };
                    reader.readAsDataURL(file);
                });
            });

            Promise.all(promises).then(loadedImages => {
                images = loadedImages;
                document.getElementById('imageCount').textContent = `Загружено: ${images.length} изображений`;
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('carouselWrapper').style.display = 'flex';
                updateCarousel();
                createThumbnails();
            });
        }

        function createThumbnails() {
            const thumbnailsContainer = document.getElementById('thumbnails');
            thumbnailsContainer.innerHTML = '';
            
            images.forEach((img, index) => {
                const thumbnail = document.createElement('img');
                thumbnail.src = img;
                thumbnail.className = 'thumbnail' + (index === currentIndex ? ' active' : '');
                thumbnail.onclick = () => goToSlide(index);
                thumbnailsContainer.appendChild(thumbnail);
            });
        }

        function updateThumbnails() {
            const thumbnails = document.querySelectorAll('.thumbnail');
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentIndex);
            });
        }

        function updateCarousel() {
            if (images.length === 0) return;

            currentStyle = document.getElementById('carouselStyle').value;
            const direction = document.getElementById('scrollDirection').value;
            const carousel = document.getElementById('carousel');
            const indicators = document.getElementById('indicators');
            
            // Clear previous content
            carousel.innerHTML = '';
            indicators.innerHTML = '';
            
            // Create slides based on style
            if (currentStyle === 'cube') {
                createCube(carousel);
            } else if (currentStyle === 'tube') {
                createTube(carousel);
            }
            
            // Create indicators
            images.forEach((_, index) => {
                const indicator = document.createElement('div');
                indicator.className = 'indicator' + (index === currentIndex ? ' active' : '');
                indicator.onclick = () => goToSlide(index);
                indicators.appendChild(indicator);
            });
            
            updateIndicators();
            applyTransform();
        }

        function createCube(carousel) {
            carousel.className = 'carousel-cube';
            const angleStep = 360 / images.length;
            
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                
                const rotationY = angleStep * index;
                const translateZ = Math.round(300 / (2 * Math.tan(Math.PI / images.length)));
                
                slide.style.transform = `rotateY(${rotationY}deg) translateZ(${translateZ}px)`;
                
                const image = document.createElement('img');
                image.src = img;
                slide.appendChild(image);
                
                carousel.appendChild(slide);
            });
        }

        function createTube(carousel) {
            carousel.className = 'carousel-tube';
            const angleStep = 360 / images.length;
            const radius = 500; // Fixed radius for tube effect
            
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                
                const rotationY = angleStep * index;
                
                slide.style.transform = `rotateY(${rotationY}deg) translateZ(${radius}px)`;
                
                const image = document.createElement('img');
                image.src = img;
                slide.appendChild(image);
                
                carousel.appendChild(slide);
            });
        }

        function applyTransform() {
            const carousel = document.getElementById('carousel');
            const direction = document.getElementById('scrollDirection').value;
            const angleStep = 360 / images.length;
            
            if (currentStyle === 'cube') {
                const rotateAngle = -currentIndex * angleStep;
                carousel.style.transform = `rotateY(${rotateAngle}deg)`;
            } else if (currentStyle === 'tube') {
                const rotateAngle = -currentIndex * angleStep;
                carousel.style.transform = `rotateY(${rotateAngle}deg)`;
            }
        }

        function updateIndicators() {
            const indicators = document.querySelectorAll('.indicator');
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
        }

        function navigate(direction) {
            if (images.length === 0) return;
            
            currentIndex += direction;
            
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            
            applyTransform();
            updateIndicators();
            updateThumbnails();
        }

        function goToSlide(index) {
            currentIndex = index;
            applyTransform();
            updateIndicators();
            updateThumbnails();
        }

        function toggleAutoScroll() {
            const autoScroll = document.getElementById('autoScroll').checked;
            
            if (autoScroll) {
                startAutoScroll();
            } else {
                stopAutoScroll();
            }
        }

        function startAutoScroll() {
            stopAutoScroll();
            
            const speed = parseInt(document.getElementById('scrollSpeed').value);
            const direction = document.getElementById('scrollDirection').value;
            const step = direction === 'reverse' ? -1 : 1;
            
            autoScrollInterval = setInterval(() => {
                if (!isPaused) {
                    navigate(step);
                }
            }, speed);
        }

        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearInterval(autoScrollInterval);
                autoScrollInterval = null;
            }
        }

        function updateSpeed() {
            const speed = document.getElementById('scrollSpeed').value;
            document.getElementById('speedValue').textContent = (speed / 1000) + 'с';
            
            if (document.getElementById('autoScroll').checked) {
                startAutoScroll();
            }
        }

        // Pause on hover
        document.getElementById('carouselContainer').addEventListener('mouseenter', () => {
            isPaused = true;
        });

        document.getElementById('carouselContainer').addEventListener('mouseleave', () => {
            isPaused = false;
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                navigate(-1);
            } else if (e.key === 'ArrowRight') {
                navigate(1);
            }
        });

        // Initialize with some demo functionality
        console.log('3D Carousel Ready! Upload 2-8 images to get started.');
    </script>
</body>
</html>
